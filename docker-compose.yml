version: "3.8"

services:
  
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: ./.env
    depends_on:
      - doris
      - milvus
      - redis
    restart: unless-stopped

  
  doris:
    image: apache/doris:doris-all-in-one-2.1.0
    ports:
      - "9030:9030"    # MySQL protocol
      - "8030:8030"    # Web UI
    volumes:
      - doris_data:/root/doris
    restart: unless-stopped

  
  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # Web UI
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  doris_data:
  milvus_data:
  redis_data:
