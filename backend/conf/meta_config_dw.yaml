tables:
- name: ads_gmv_total_day
  role: fact
  description: ADS-每日 GMV
  columns:
  - name: dt
    role: dimension
    description: 日期（分区主键），格式YYYY-MM-DD，如2026-08-07
    alias: []
    sync: false
  - name: gmv
    role: measure
    description: GMV成交总额=当日已支付订单的金额合计（SUM(total_amount) WHERE order_status='1001'）。问GMV/营收/销售额用此字段
    alias: []
    sync: false
  - name: order_count
    role: measure
    description: 订单数=当日已支付订单总数（COUNT WHERE order_status='1001'）。问订单数/订单量/订单笔数用此字段
    alias: []
    sync: false
  - name: payer_count
    role: measure
    description: 支付用户数=当日已支付的去重用户数（COUNT DISTINCT user_id WHERE order_status='1001'）
    alias: []
    sync: false
  - name: avg_order_amount
    role: measure
    description: 客单价/平均订单金额=当日GMV除以当日订单数（SUM(total_amount)/COUNT(1) WHERE order_status='1001'）。问平均金额/客单价用此字段
    alias: []
    sync: false
- name: ads_user_repurchase
  role: fact
  description: ADS-用户复购率
  columns:
  - name: dt
    role: dimension
    description: 日期
    alias: []
    sync: false
  - name: total_user_count
    role: measure
    description: 截止当日累计支付用户总数（去重）
    alias: []
    sync: false
  - name: repurchase_user_count
    role: measure
    description: 截止当日累计支付>=2次的用户数
    alias: []
    sync: false
  - name: repurchase_rate
    role: measure
    description: 复购率=复购用户数除以总用户数（repurchase_user_count/total_user_count）
    alias: []
    sync: false
