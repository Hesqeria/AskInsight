logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

doris:
  host: ${oc.env:DORIS_HOST,127.0.0.1}
  port: 9030
  user: root
  password: ${oc.env:DORIS_PASSWORD,}
  database: dw

milvus:
  host: ${oc.env:MILVUS_HOST,127.0.0.1}
  port: 19530
  user: root
  password: ${oc.env:MILVUS_PASSWORD,}
  embedding_size: 1024
  column_collection: data-agent-column
  metric_collection: data-agent-metric

embedding:
  api_base: ${oc.env:EMBEDDING_BASE_URL,}
  api_key: ${oc.env:EMBEDDING_API_KEY,}
  model: ${oc.env:EMBEDDING_MODEL,text-embedding-v3}

redis:
  host: ${oc.env:REDIS_HOST,127.0.0.1}
  port: 6379
  password: ${oc.env:REDIS_PASSWORD,}

superset:
  url: ${oc.env:SUPERSET_URL,http://127.0.0.1:8088}
  username: ${oc.env:SUPERSET_USER,admin}
  password: ${oc.env:SUPERSET_PASSWORD,}

llm:
  model_name: ${oc.env:LLM_MODEL_NAME,deepseek-chat}
  api_key: ${oc.env:LLM_API_KEY,}
  base_url: ${oc.env:LLM_BASE_URL,https://api.deepseek.com}

pg:
  host: ${oc.env:PG_HOST,127.0.0.1}
  port: 5432
  user: app
  password: ${oc.env:PG_PASSWORD,}
  database: app

mysql:
  host: ${oc.env:MYSQL_HOST,127.0.0.1}
  port: 3306
  user: root
  password: ${oc.env:MYSQL_PASSWORD,}
  database: test
